<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Lobey</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #E91E63, #9C27B0); margin: 0; padding: 0; height: 100vh; }
    .chat-box { max-width: 600px; margin: 0 auto; background: white; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #E91E63; color: white; padding: 15px; display: flex; align-items: center; gap: 10px; }
    .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; background: #f5f5f5; display: flex; flex-direction: column; }
    .msg { margin: 8px 0; padding: 12px 16px; border-radius: 18px; max-width: 75%; word-wrap: break-word; }
    .me { background: #E91E63; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
    .them { background: white; color: #333; border: 1px solid #ddd; border-bottom-left-radius: 4px; }
    .input-area { display: flex; padding: 12px; border-top: 1px solid #ddd; background: white; gap: 8px; }
    .input-area input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 15px; }
    .input-area button { background: #E91E63; color: white; border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="header">
      <button class="back-btn" onclick="window.history.back()">←</button>
      <div id="chatWith">Chat</div>
    </div>
    <div class="messages" id="messages">
      <p style="text-align:center; color:#999; margin-top:50px;">Ap chaje mesaj...</p>
    </div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Ekri mesaj ou...">
      <button onclick="sendMessage()">Voye</button>
    </div>
  </div>
  <script type="module">
    const firebaseConfig = {
      apiKey: "KOLE_API_KEY_OU_ISIT_LA",
      authDomain: "KOLE_AUTHDOMAIN_OU_ISIT_LA", 
      projectId: "KOLE_PROJECTID_OU_ISIT_LA",
      storageBucket: "KOLE_STORAGEBUCKET_OU_ISIT_LA",
      messagingSenderId: "KOLE_MESSAGINGSENDERID_OU_ISIT_LA",
      appId: "KOLE_APPID_OU_ISIT_LA"
    };
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const urlParams = new URLSearchParams(window.location.search);
    const otherUserId = urlParams.get('with');
    let currentUserId;
    if (!otherUserId) { alert("Erè: Pa gen itilizatè pou chat"); window.location.href = 'index.html'; }
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        const userDoc = await getDoc(doc(db, "users", otherUserId));
        if(userDoc.exists()){ document.getElementById('chatWith').textContent = userDoc.data().name || "Itilizatè"; }
        loadMessages();
      } else { window.location.href = 'index.html'; }
    });
    function getChatId(uid1, uid2) { return uid1 < uid2 ? uid1 + "_" + uid2 : uid2 + "_" + uid1; }
    window.sendMessage = async function() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (text === "" || !currentUserId) return;
      const chatId = getChatId(currentUserId, otherUserId);
      await addDoc(collection(db, "chats", chatId, "messages"), { senderId: currentUserId, text: text, createdAt: serverTimestamp() });
      input.value = "";
    }
    function loadMessages() {
      const chatId = getChatId(currentUserId, otherUserId);
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt"));
      onSnapshot(q, (snapshot) => {
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML = "";
        if(snapshot.empty){ messagesDiv.innerHTML = '<p style="text-align:center; color:#999; margin-top:50px;">Di Bonjou premye 👇</p>'; }
        snapshot.forEach((doc) => {
          const msg = doc.data();
          const div = document.createElement('div');
          div.classList.add('msg');
          div.classList.add(msg.senderId === currentUserId ? 'me' : 'them');
          div.textContent = msg.text;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }
    document.getElementById('msgInput').addEventListener("keypress", function(e) { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
